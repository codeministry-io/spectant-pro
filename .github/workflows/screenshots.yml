# Deploy screenshots (cm-k8s-cluster spec 017): after every image build on main, wait until spectant.pro serves
# the new bundles, record it at 1440 and at 390 and post both images to Slack. Its own file, never trivy.yml, so
# `gh workflow disable screenshots.yml` stops it without touching the CVE scan. The workflow itself lives in
# codeministry-io/.github. Not a required check: a red run blocks nothing.
name: Deploy screenshots

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      wait-minutes:
        description: Wait for new bundles at most this long
        type: number
        default: 1

permissions:
  contents: read

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    permissions:
      contents: read
    uses: codeministry-io/.github/.github/workflows/deploy-screenshots.yml@main
    with:
      pages: |
        https://spectant.pro/
      wait-minutes: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.wait-minutes || '15') }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_SCREENSHOTS_TOKEN }}
